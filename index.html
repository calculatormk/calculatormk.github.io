<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Aplikasi Kalkulator Penghitung Masa Kerja PNS (MK Golongan, MK PNS, MK Pensiun)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Kalkulator MK">
    <title>Kalkulator Masa Kerja</title>

    <!-- Google Fonts: Plus Jakarta Sans (UI) & JetBrains Mono (Angka Presisi) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        brand: {
                            blue: '#0284c7',
                            indigo: '#4f46e5',
                            orange: '#f97316',
                            rose: '#e11d48',
                        }
                    },
                    boxShadow: {
                        'calculator': '0 12px 28px -6px rgba(15, 23, 42, 0.14), 0 0 0 1px rgba(15, 23, 42, 0.06)',
                        'well': 'inset 0 1px 2px 0 rgba(15, 23, 42, 0.03)',
                        'input-focus': '0 0 0 1.5px rgba(2, 132, 199, 0.22)',
                    }
                }
            }
        }
    </script>

    <style>
        /* Reset & Custom Styling untuk Tampilan Super Micro (Zero-Scroll 1 Frame) */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* Hilangkan panah spinner bawaan pada input number */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        /* Background Desktop Saat Dibuka di Tab Browser Lebar */
        body {
            background-color: #f1f5f9;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 14px 14px;
            color: #0f172a;
            overflow: hidden;
        }

        /* Mode Otomatis Fluid Saat Jendela Dikecilkan: KUNCI DI ATAS (flex-start), JANGAN space-between */
        @media (max-width: 380px), (max-height: 380px) {
            body {
                background: #ffffff !important;
                padding: 0 !important;
                align-items: flex-start !important;
                justify-content: flex-start !important;
            }
            #calculator-shell {
                max-width: 100vw !important;
                width: 100vw !important;
                height: auto !important;
                min-height: 100vh !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                border: none !important;
                display: flex;
                flex-direction: column;
                justify-content: flex-start !important;
            }
        }

        /* Ukuran Tipografi & Input Ultra-Rapat (Total Tinggi Konten ~172px, 100% Muat 6 Baris) */
        .calculator-shell-box {
            padding: 3px 6px 4px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 3px;
        }
        .app-header-bar {
            height: 18px;
            padding: 0;
            margin-bottom: 1px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .section-block-well {
            background: #f8fafc;
            border: 1px solid rgba(226, 232, 240, 0.75);
            border-radius: 7px;
            padding: 3px 6px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 1.5px;
        }
        .sm-header-title {
            font-size: 10px;
            line-height: 1;
        }
        .sm-section-title {
            font-size: 9.2px;
            line-height: 1;
            letter-spacing: -0.03em;
        }
        .sm-col-head {
            font-size: 8px;
            line-height: 1;
        }
        .result-row-item {
            display: grid;
            grid-template-columns: 1.25fr 0.85fr 0.85fr;
            gap: 4px;
            align-items: center;
            height: 15px;
            padding: 0;
            margin: 0;
        }
        .res-label {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 100%;
            line-height: 1;
            margin: 0;
            padding: 0 0 0 2px;
        }
        .res-val {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            line-height: 1;
            margin: 0;
            padding: 0;
            font-variant-numeric: tabular-nums;
        }
        .input-rows-wrap {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 1px;
        }
        .input-row-item {
            display: grid;
            grid-template-columns: 1.25fr 0.85fr 0.85fr;
            gap: 4px;
            align-items: center;
            height: 16px;
            padding: 0.5px 0;
            background: transparent;
            border: none;
        }
        .sm-row-label {
            font-size: 9.5px;
            line-height: 1;
            display: flex;
            align-items: center;
            height: 100%;
        }
        .sm-res-val {
            font-size: 9.5px;
            line-height: 1;
        }
        .sm-input {
            height: 15px;
            font-size: 9.5px;
            line-height: 1;
            padding: 0 2px;
            border-radius: 3.5px;
            border: 1px solid #cbd5e1;
            background: #ffffff;
        }
    </style>
</head>

    <!-- SCRIPT UTAMA: Logika Rumus Excel, Validasi Input, dan Konfigurasi PWA Otomatis -->
    <script>
        (function () {
            // Daftar seluruh ID sel input sesuai koordinat di Excel
            const inputIds = ['C4', 'D4', 'C5', 'D5', 'C6', 'D6', 'C7', 'D7', 'C8', 'D8', 'C9', 'D9'];
            const inputs = {};
            inputIds.forEach(id => {
                inputs[id] = document.getElementById(id);
            });

            // Elemen Output Hasil Baris ke Bawah (Tahun: G4..G6, Bulan: H4..H6)
            const valG4 = document.getElementById('val-g4');
            const valH4 = document.getElementById('val-h4');
            const valG5 = document.getElementById('val-g5');
            const valH5 = document.getElementById('val-h5');
            const valG6 = document.getElementById('val-g6');
            const valH6 = document.getElementById('val-h6');

            // Fungsi Pembantu: Ambil nilai numerik dari input (0 jika kosong)
            function getVal(id) {
                const raw = inputs[id].value.trim();
                if (raw === '') return 0;
                const parsed = parseInt(raw, 10);
                return isNaN(parsed) ? 0 : parsed;
            }

            // Fungsi Pembantu: Cek apakah suatu input sudah diisi oleh user
            function isFilled(id) {
                return inputs[id].value.trim() !== '';
            }

            // FUNGSI INTI: Perhitungan Backend (100% Identik dengan Rumus Excel)
            function calculateMasaKerja() {
                const anyFilled = inputIds.some(id => isFilled(id));
                if (!anyFilled) {
                    resetResultDisplay();
                    return;
                }

                // Ambil nilai Tabel Isian (C4:D9)
                const C4 = getVal('C4'), D4 = getVal('D4'); // TMT Pensiun
                const C5 = getVal('C5'), D5 = getVal('D5'); // TMT CPNS
                const C6 = getVal('C6'), D6 = getVal('D6'); // PMK
                const C7 = getVal('C7'), D7 = getVal('D7'); // TMT KP terakhir
                const C8 = getVal('C8'), D8 = getVal('D8'); // MK KP terakhir
                const C9 = getVal('C9'), D9 = getVal('D9'); // CLTN

                // =========================================================
                // PROSES BACKEND (Sesuai Rumus Sel Baris 12 s/d 19 di Excel)
                // =========================================================
                // C12 : =C5 | D12 : =IF(D5<70;D5+2000;D5+1900)
                const C12 = C5;
                const D12 = (D5 < 70) ? (D5 + 2000) : (D5 + 1900);

                // C13 : =C4 | D13 : =IF(D4<70;D4+2000;D4+1900)
                const C13 = C4;
                const D13 = (D4 < 70) ? (D4 + 2000) : (D4 + 1900);

                // C14 : =C6 | D14 : =D6
                const C14 = C6;
                const D14 = D6;

                // C15 : =C9 | D15 : =D9
                const C15 = C9;
                const D15 = D9;

                // C16 : =C7 | D16 : =IF(D7<70;D7+2000;D7+1900)
                const C16 = C7;
                const D16 = (D7 < 70) ? (D7 + 2000) : (D7 + 1900);

                // C17 : =IF(C8<1;12;C8) | D17 : =IF(C8<1;D8-1;D8)
                const C17 = (C8 < 1) ? 12 : C8;
                const D17 = (C8 < 1) ? (D8 - 1) : D8;

                // C19 : =IF(C13>C16;C13-C16-1;IF(C13<=C16;C13+12-C16-1))
                const C19 = (C13 > C16) ? (C13 - C16 - 1) : (C13 + 12 - C16 - 1);
                // D19 : =IF(C13>C16;D13-D16;IF(C13<=C16;D13-1-D16))
                const D19 = (C13 > C16) ? (D13 - D16) : (D13 - 1 - D16);

                // =========================================================
                // TABEL HASIL (G4:H6)
                // =========================================================
                // G4 : =IF(C17+C19>=12;D17+D19+1;IF(C17+C19<12;D17+D19))
                const G4 = (C17 + C19 >= 12) ? (D17 + D19 + 1) : (D17 + D19);
                // H4 : =IF(C17+C19>=12;C17+C19-12;IF(C17+C19<12;C17+C19))
                const H4 = (C17 + C19 >= 12) ? (C17 + C19 - 12) : (C17 + C19);

                // G5 : =IF(C13>=C12;D13-D12;IF(C13<C12;D13-D12-1))-D15
                const G5 = ((C13 >= C12) ? (D13 - D12) : (D13 - D12 - 1)) - D15;
                // H5 : =IF(C13>=C12;C13-C12;IF(C13<C12;C13+12-C12))-C15
                const H5 = ((C13 >= C12) ? (C13 - C12) : (C13 + 12 - C12)) - C15;

                // G6 : =IF(H5+C14-C15>=12;G5+D14-D15+1;IF(H5+C14-C15<12;G5+D14-D15))
                const G6 = (H5 + C14 - C15 >= 12) ? (G5 + D14 - D15 + 1) : (G5 + D14 - D15);
                // H6 : =IF(H5+C14-C15>=12;H5+C14-C15-12;IF(H5+C14-C15<12;H5+C14-C15))
                const H6 = (H5 + C14 - C15 >= 12) ? (H5 + C14 - C15 - 12) : (H5 + C14 - C15);

                // =========================================================
                // RENDER HASIL KE TABEL BARIS (G4..H6) DENGAN WARNA IDENTITAS SERAGAM
                // =========================================================
                const hasGolInput = isFilled('C4') || isFilled('D4') || isFilled('C7') || isFilled('D7') || isFilled('C8') || isFilled('D8');
                const hasPnsInput = isFilled('C4') || isFilled('D4') || isFilled('C5') || isFilled('D5');

                if (hasGolInput) {
                    valG4.textContent = G4;
                    valH4.textContent = H4;
                    valG4.className = 'res-val sm-res-val font-mono font-extrabold text-brand-blue';
                    valH4.className = 'res-val sm-res-val font-mono font-extrabold text-brand-blue';
                } else {
                    valG4.textContent = 'xx';
                    valH4.textContent = 'xx';
                    valG4.className = 'res-val sm-res-val font-mono font-semibold text-slate-400';
                    valH4.className = 'res-val sm-res-val font-mono font-semibold text-slate-400';
                }

                if (hasPnsInput) {
                    valG5.textContent = G5;
                    valH5.textContent = H5;
                    valG5.className = 'res-val sm-res-val font-mono font-extrabold text-brand-indigo';
                    valH5.className = 'res-val sm-res-val font-mono font-extrabold text-brand-indigo';

                    valG6.textContent = G6;
                    valH6.textContent = H6;
                    valG6.className = 'res-val sm-res-val font-mono font-extrabold text-brand-orange';
                    valH6.className = 'res-val sm-res-val font-mono font-extrabold text-brand-orange';
                } else {
                    valG5.textContent = 'xx';
                    valH5.textContent = 'xx';
                    valG5.className = 'res-val sm-res-val font-mono font-semibold text-slate-400';
                    valH5.className = 'res-val sm-res-val font-mono font-semibold text-slate-400';

                    valG6.textContent = 'xx';
                    valH6.textContent = 'xx';
                    valG6.className = 'res-val sm-res-val font-mono font-semibold text-slate-400';
                    valH6.className = 'res-val sm-res-val font-mono font-semibold text-slate-400';
                }
            }

            // Kembalikan Tampilan Hasil ke Default ("xx")
            function resetResultDisplay() {
                [valG4, valH4, valG5, valH5, valG6, valH6].forEach(el => {
                    el.textContent = 'xx';
                    el.className = 'res-val sm-res-val font-mono font-semibold text-slate-400';
                });
            }

            // Validasi & Sanitasi Input Real-Time (Bulan 1-12 atau 0-12, Tahun maks 2 digit)
            inputIds.forEach((id, idx) => {
                const el = inputs[id];

                el.addEventListener('input', function () {
                    let cleaned = this.value.replace(/[^0-9]/g, '');

                    const dtype = this.getAttribute('data-type');
                    if (dtype === 'year-2digit' || dtype === 'duration-year') {
                        if (cleaned.length > 2) cleaned = cleaned.slice(0, 2);
                    } else if (dtype === 'month-1-12') {
                        if (cleaned.length > 2) cleaned = cleaned.slice(0, 2);
                        const num = parseInt(cleaned, 10);
                        if (num > 12) cleaned = '12';
                        if (cleaned === '0') cleaned = '1';
                    } else if (dtype === 'month-0-12') {
                        if (cleaned.length > 2) cleaned = cleaned.slice(0, 2);
                        const num = parseInt(cleaned, 10);
                        if (num > 12) cleaned = '12';
                    }

                    if (this.value !== cleaned) {
                        this.value = cleaned;
                    }

                    calculateMasaKerja();
                });

                // Navigasi Keyboard Cepat: Tekan Enter pindah ke kolom berikutnya
                el.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        const nextId = inputIds[idx + 1];
                        if (nextId && inputs[nextId]) {
                            inputs[nextId].focus();
                            inputs[nextId].select();
                        }
                    }
                });

                el.addEventListener('focus', function () {
                    this.select();
                });
            });

            // Tombol Reset Semua Isian
            function resetAll() {
                inputIds.forEach(id => {
                    inputs[id].value = '';
                });
                resetResultDisplay();
                inputs['C4'].focus();
            }

            document.getElementById('btn-reset').addEventListener('click', resetAll);

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') {
                    resetAll();
                }
            });

            // Tombol "Contoh": Mengisi data persis seperti screenshot Excel Anda
            document.getElementById('btn-sample').addEventListener('click', function () {
                const sampleData = {
                    C4: '9',  D4: '26',
                    C5: '3',  D5: '9',
                    C6: '0',  D6: '2',
                    C7: '10', D7: '18',
                    C8: '7',  D8: '7',
                    C9: '0',  D9: '1'
                };
                Object.keys(sampleData).forEach(id => {
                    inputs[id].value = sampleData[id];
                });
                calculateMasaKerja();
            });

            // Tombol "Mini Window": Membuka jendela seukuran kalkulator Super Micro (~252 x 295 px)
            const MICRO_WIDTH = 252;
            const MICRO_HEIGHT = 295;

            document.getElementById('btn-mini').addEventListener('click', function () {
                const left = window.screen.availWidth - MICRO_WIDTH - 24;
                const top = 60;

                if (window.opener || window.matchMedia('(display-mode: standalone)').matches) {
                    try {
                        window.resizeTo(MICRO_WIDTH, MICRO_HEIGHT);
                        return;
                    } catch (err) {}
                }

                window.open(
                    window.location.href,
                    'KalkulatorMasaKerjaPNS',
                    `width=${MICRO_WIDTH},height=${MICRO_HEIGHT},left=${left},top=${top},resizable=yes,scrollbars=no,toolbar=no,menubar=no,location=no,status=no`
                );
            });

            // =========================================================================
            // KONFIGURASI PWA SINGLE-FILE OTOMATIS
            // =========================================================================
            try {
                const appIconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
                    <rect width="128" height="128" rx="28" fill="#ffffff"/>
                    <rect x="4" y="4" width="120" height="120" rx="24" fill="#f8fafc" stroke="#e2e8f0" stroke-width="4"/>
                    <path d="M24 50L50 60M24 64L48 64M24 78L50 68M104 50L78 60M104 64L80 64M104 78L78 68" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
                    <path d="M34 92C48 74 58 48 64 28C70 48 80 74 94 92" stroke="#e11d48" stroke-width="7.5" stroke-linecap="round"/>
                    <circle cx="64" cy="19" r="7" fill="#e11d48"/>
                    <path d="M30 82C44 70 84 70 98 82" stroke="#0284c7" stroke-width="7.5" stroke-linecap="round"/>
                    <path d="M44 98C52 84 76 84 84 98" stroke="#0284c7" stroke-width="7" stroke-linecap="round"/>
                </svg>`;
                const iconUrl = 'data:image/svg+xml;utf8,' + encodeURIComponent(appIconSvg);

                const manifestData = {
                    name: "Kalkulator Masa Kerja PNS",
                    short_name: "Kalkulator MK",
                    description: "Aplikasi Kalkulator Penghitung Masa Kerja PNS",
                    start_url: window.location.href,
                    display: "standalone",
                    background_color: "#ffffff",
                    theme_color: "#ffffff",
                    icons: [
                        {
                            src: iconUrl,
                            sizes: "128x128 512x512",
                            type: "image/svg+xml",
                            purpose: "any maskable"
                        }
                    ]
                };

                const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
                const manifestURL = URL.createObjectURL(manifestBlob);
                const linkEl = document.createElement('link');
                linkEl.rel = 'manifest';
                linkEl.href = manifestURL;
                document.head.appendChild(linkEl);
            } catch (e) {}

            let deferredPrompt = null;
            const btnInstall = document.getElementById('btn-install-pwa');
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                btnInstall.classList.remove('hidden');
            });

            btnInstall.addEventListener('click', async () => {
                if (!deferredPrompt) return;
                deferredPrompt.prompt();
                await deferredPrompt.userChoice;
                deferredPrompt = null;
                btnInstall.classList.add('hidden');
            });

            // Jika dibuka sebagai PWA Standalone / Popup, otomatis kecilkan ke ukuran Micro
            window.addEventListener('load', () => {
                if (window.matchMedia('(display-mode: standalone)').matches || window.opener) {
                    try {
                        window.resizeTo(MICRO_WIDTH, MICRO_HEIGHT);
                    } catch (err) {}
                }
                inputs['C4'].focus();
            });
        })();
    </script>
</body>
</html>
